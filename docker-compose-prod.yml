services:

  # PostgreSQL
  postgres-user:
    image: postgres:16
    container_name: rp-gym-postgres-user
    restart: unless-stopped

    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-user-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  postgres-health:
    image: postgres:16
    container_name: rp-gym-postgres-health
    restart: unless-stopped

    environment:
      POSTGRES_DB: health_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-health-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  postgres-game:
    image: postgres:16
    container_name: rp-gym-postgres-game
    restart: unless-stopped

    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-game-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

  # Kafka
  kafka:
    image: apache/kafka:4.3.1
    container_name: rp-gym-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - shared-network

  # Redis
  redis:
    image: redis:latest
    container_name: rp-gym-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    networks:
      - shared-network

  # Eureka Blue
  eureka-server-blue:
    build:
      context: ./deploy/blue/eureka
      dockerfile: ../../Dockerfile

    container_name: rp-gym-eureka-blue
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

    expose:
      - "19000"

    networks:
      - blue-network

  # Eureka Green
  eureka-server-green:
    build:
      context: ./deploy/green/eureka
      dockerfile: ../../Dockerfile

    container_name: rp-gym-eureka-green
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

    expose:
      - "19000"

    networks:
      - green-network


  # Gateway Blue
  gateway-blue:
    build:
      context: ./deploy/blue/gateway
      dockerfile: ../../Dockerfile

    container_name: rp-gym-gateway-blue
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      EUREKA_SERVER_URL: http://eureka-server-blue:19000/eureka/

      JWT_SECRET: ${JWT_SECRET}

    expose:
      - "19001"

    depends_on:
      - eureka-server-blue

    networks:
      - blue-network

  # Gateway Green
  gateway-green:
    build:
      context: ./deploy/green/gateway
      dockerfile: ../../Dockerfile

    container_name: rp-gym-gateway-green
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      EUREKA_SERVER_URL: http://eureka-server-green:19000/eureka/

      JWT_SECRET: ${JWT_SECRET}

    expose:
      - "19001"

    depends_on:
      - eureka-server-green

    networks:
      - green-network

  # User Blue
  user-service-blue:
    build:
      context: ./deploy/blue/user
      dockerfile: ../../Dockerfile

    container_name: rp-gym-user-blue
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      POSTGRES_URL: jdbc:postgresql://postgres-user:5432/user_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_SERVER_URL: http://eureka-server-blue:19000/eureka/

      JWT_SECRET: ${JWT_SECRET}

      EUREKA_INSTANCE_HOSTNAME: user-service-blue

    expose:
      - "19010"

    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server-blue:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - blue-network
      - shared-network

  # User Green
  user-service-green:
    build:
      context: ./deploy/green/user
      dockerfile: ../../Dockerfile

    container_name: rp-gym-user-green
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      POSTGRES_URL: jdbc:postgresql://postgres-user:5432/user_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_SERVER_URL: http://eureka-server-green:19000/eureka/

      JWT_SECRET: ${JWT_SECRET}

      EUREKA_INSTANCE_HOSTNAME: user-service-green

    expose:
      - "19010"

    depends_on:
      postgres-user:
        condition: service_healthy
      eureka-server-green:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - green-network
      - shared-network

  # Health Blue
  health-service-blue:
    build:
      context: ./deploy/blue/health
      dockerfile: ../../Dockerfile

    container_name: rp-gym-health-blue
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      POSTGRES_URL: jdbc:postgresql://postgres-health:5432/health_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_SERVER_URL: http://eureka-server-blue:19000/eureka/

    expose:
      - "19011"

    depends_on:
      postgres-health:
        condition: service_healthy
      eureka-server-blue:
        condition: service_started
      kafka:
        condition: service_started

    networks:
      - blue-network
      - shared-network

  # Health Green
  health-service-green:
    build:
      context: ./deploy/green/health
      dockerfile: ../../Dockerfile

    container_name: rp-gym-health-green
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      POSTGRES_URL: jdbc:postgresql://postgres-health:5432/health_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_SERVER_URL: http://eureka-server-green:19000/eureka/

    expose:
      - "19011"

    depends_on:
      postgres-health:
        condition: service_healthy
      eureka-server-green:
        condition: service_started
      kafka:
        condition: service_started

    networks:
      - green-network
      - shared-network

  # Game Blue
  game-service-blue:
    build:
      context: ./deploy/blue/game
      dockerfile: ../../Dockerfile

    container_name: rp-gym-game-blue
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      POSTGRES_URL: jdbc:postgresql://postgres-game:5432/game_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_SERVER_URL: http://eureka-server-blue:19000/eureka/

    expose:
      - "19012"

    depends_on:
      postgres-game:
        condition: service_healthy
      eureka-server-blue:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - blue-network
      - shared-network

  # Game Green
  game-service-green:
    build:
      context: ./deploy/green/game
      dockerfile: ../../Dockerfile

    container_name: rp-gym-game-green
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      POSTGRES_URL: jdbc:postgresql://postgres-game:5432/game_db
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_SERVER_URL: http://eureka-server-green:19000/eureka/

    expose:
      - "19012"

    depends_on:
      postgres-game:
        condition: service_healthy
      eureka-server-green:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - green-network
      - shared-network

  # Nginx
  nginx:
    image: nginx:latest
    container_name: rp-gym-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/service-url.inc:/etc/nginx/conf.d/service-url.inc:ro

    depends_on:
      - gateway-blue
      - gateway-green

    networks:
      - blue-network
      - green-network

volumes:
  postgres-user-data:
  postgres-health-data:
  postgres-game-data:

  kafka-data:
  redis-data:

networks:
  shared-network:
    name: rp-gym-shared-network
    driver: bridge

  blue-network:
    name: rp-gym-blue-network
    driver: bridge

  green-network:
    name: rp-gym-green-network
    driver: bridge