server:
  port: 19011

spring:
  application:
    name: health-service

  config:
    # 서비스 디렉터리의 .env를 프로퍼티 파일로 읽는다.
    # 확장자가 없으므로 [.properties]로 파서를 지정한다.
    # optional: 이므로 파일이 없어도 기동에 실패하지 않는다(Docker/CI).
    # OS 환경변수가 우선순위가 높으므로 Compose의 env_file이 항상 이긴다.
    # 실행 위치에 따라 작업 디렉터리가 달라지므로 두 경로를 모두 시도한다.
    # (모듈 디렉터리에서 실행 / 프로젝트 루트에서 실행)
    import:
      - optional:file:.env[.properties]
      - optional:file:health-service/.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  jpa:
    hibernate:
      # Flyway 도입 전까지는 DDL을 직접 실행하고 매핑 검증만 수행
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Health Service가 소유한 스키마
        default_schema: health_service
    open-in-view: false

  jackson:
    serialization:
      # 날짜/시각을 epoch 숫자가 아닌 ISO-8601 문자열로 직렬화
      write-dates-as-timestamps: false

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:19000/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info