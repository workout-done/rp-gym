server:
  port: 19011

spring:
  application:
    name: health-service

  config:
    # 서비스 디렉터리의 .env를 프로퍼티 파일로 읽는다.
    # 확장자가 없으므로 [.properties]로 파서를 지정한다.
    # optional: 이므로 파일이 없어도 기동에 실패하지 않는다(Docker/CI).
    # OS 환경변수가 우선순위가 높으므로 Compose의 env_file이 항상 이긴다.
    # 실행 위치에 따라 작업 디렉터리가 달라지므로 두 경로를 모두 시도한다.
    # (모듈 디렉터리에서 실행 / 프로젝트 루트에서 실행)
    import:
      - optional:file:.env[.properties]
      - optional:file:health-service/.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      # Outbox payload를 문자열 원문 그대로 싣는다. 직렬화기가 값을 다시 만들지 않도록 String으로 고정
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 모든 ISR 응답을 기다린다. 발행 성공으로 PUBLISHED를 찍는 이상 유실을 허용할 수 없다
      acks: all
      properties:
        # 프로듀서 내부 재시도로 인한 중복 적재 방지 + 파티션 내 순서 보장
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000

  jpa:
    hibernate:
      # Flyway 도입 전까지는 DDL을 직접 실행하고 매핑 검증만 수행
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Health Service가 소유한 스키마
        default_schema: health_service
    open-in-view: false

  jackson:
    serialization:
      # 날짜/시각을 epoch 숫자가 아닌 ISO-8601 문자열로 직렬화
      write-dates-as-timestamps: false

rpgym:
  outbox:
    # PENDING 폴링 주기 (ms)
    poll-interval: 1000
    # 한 라운드에 처리할 최대 건수
    poll-size: 100
    # 이 횟수만큼 실패하면 DLQ로 보내고 FAILED로 종료한다
    max-retry: 5
    # Kafka 발행 응답 대기 시간
    send-timeout: 5s
    dlq-suffix: .dlq
    # 토픽명은 Game Service 컨슈머와 반드시 일치해야 한다
    topics:
      HEALTH_ACTIVITY_SYNCED: health.activity.synced
      QUEST_SUGGESTED: health.quest.suggested
      DAILY_GOAL_COMPLETED: health.daily-goal.completed

eureka:
  instance:
    # Eureka Server에 주소를 등록할 때 hostname 대신 IP를 선호
    prefer-ip-address: true

  client:
    # Eureka Server에 Health Service 등록
    register-with-eureka: true

    # Eureka Registry의 서비스 목록을 가져옴
    fetch-registry: true

    service-url:
      # Eureka Server 주소
      defaultZone: http://localhost:19000/eureka/

management:
  endpoints:
    web:
      exposure:
        # HTTP로 노출할 Actuator Endpoint
        # health: 애플리케이션 상태 확인, info: 애플리케이션 정보 확인
        include: health, info