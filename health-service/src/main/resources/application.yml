server:
  port: 19011

spring:
  application:
    name: health-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: health_service
        format_sql: true
    open-in-view: false

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:19000/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info