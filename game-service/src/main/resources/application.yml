server:
  port: 19012

spring:
  application:
    name: game-service

  config:
    # 서비스 디렉터리의 .env 를 프로퍼티 파일로 읽는다.
    # 실행 위치에 따라 작업 디렉터리가 달라지므로 두 경로를 모두 시도한다.
    # (gradlew bootRun → game-service/ , IntelliJ Run → 프로젝트 루트)
    import:
      - optional:file:.env[.properties]
      - optional:file:game-service/.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  jpa:
    # ddl-auto: validate 는 지금 켤 수 없다.
    # Quest 엔티티가 game_service.quests 를 선언하는데 그 테이블을 만드는 마이그레이션이
    # 아직 없어서(퀘스트 담당 범위) validate 가 부팅을 막는다.
    # quests DDL 이 정리되면 별도 PR 로 켠다.
    open-in-view: false


eureka:
  instance:
    # Eureka Server에 주소를 등록할 때 hostname 대신 IP를 선호
    prefer-ip-address: true

  client:
    # Eureka Server에 Game Service 등록
    register-with-eureka: true

    # Eureka Registry의 서비스 목록을 가져옴
    fetch-registry: true

    service-url:
      # Eureka Server 주소
      defaultZone: http://localhost:19000/eureka/

management:
  endpoints:
    web:
      exposure:
        # HTTP로 노출할 Actuator Endpoint
        # health: 애플리케이션 상태 확인, info: 애플리케이션 정보 확인
        include: health, info

rpgym:
  xp:
    source: mock # wallets 준비되면 wallet 으로 변경