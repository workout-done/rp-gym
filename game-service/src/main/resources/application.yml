server:
  port: 19012

spring:
  application:
    name: game-service

  config:
    # 실행 위치에 따라 작업 디렉터리가 다르므로 두 경로를 모두 시도한다
    # (모듈 디렉터리 실행 / 프로젝트 루트 실행)
    import:
      - optional:file:.env[.properties]
      - optional:file:game-service/.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # DDL은 Flyway가 만든다. 엔티티와 실제 테이블이 어긋나면 기동 시점에 실패한다
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 엔티티에 schema를 지정하지 않은 것(characters)도 이 스키마로 해석된다
        default_schema: game_service

  flyway:
    # flyway_schema_history와 수식어 없는 DDL이 public이 아니라 이 스키마에 생긴다
    schemas: game_service

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      # Health 이벤트 3종이 한 토픽으로 오므로 컨슈머 그룹도 하나다
      group-id: game-service
      # 컨슈머가 늦게 떠도 밀린 이벤트를 처음부터 읽는다. 유실 0의 전제
      auto-offset-reset: earliest
      # 자동 커밋은 처리 성공과 무관하게 시간으로 커밋한다. 실패한 이벤트가 조용히 사라진다
      enable-auto-commit: false
      # envelope의 eventType을 읽기 전에는 타입을 모른다. 문자열로 받아 컨슈머가 분기한다
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      # 레코드 하나 처리할 때마다 커밋. 배치 커밋은 중간에서 죽으면 처리한 것까지 재처리된다
      ack-mode: RECORD
      # Kafka 구간은 기본 설정으로 traceId가 끊긴다. 켜야 헤더로 전파된다
      observation-enabled: true

eureka:
  instance:
    # Eureka Server에 주소를 등록할 때 hostname 대신 IP를 선호
    prefer-ip-address: true

  client:
    # Eureka Server에 Game Service 등록
    register-with-eureka: true

    # Eureka Registry의 서비스 목록을 가져옴
    fetch-registry: true

    service-url:
      # Eureka Server 주소
      defaultZone: http://localhost:19000/eureka/

management:
  endpoints:
    web:
      exposure:
        # HTTP로 노출할 Actuator Endpoint
        # health: 애플리케이션 상태 확인, info: 애플리케이션 정보 확인
        include: health, info

app:
  kafka:
    #  이벤트 계약 -- Health 3종을 한 토픽으로 통합했다
    health-events-topic: health.events

rpgym:
  xp:
    # mock: 해시 기반 가짜 XP / wallet: XpQueryService 경유 실제 wallets
    source: mock
