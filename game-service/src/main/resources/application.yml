server:
  port: 19012

spring:
  application:
    name: game-service

  config:
    # 서비스 디렉터리의 .env 를 프로퍼티 파일로 읽는다.
    # 실행 위치에 따라 작업 디렉터리가 달라지므로 두 경로를 모두 시도한다.
    # (gradlew bootRun → game-service/ , IntelliJ Run → 프로젝트 루트)
    import:
      - optional:file:.env[.properties]
      - optional:file:game-service/.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  jpa:
    hibernate:
      # Flyway 가 스키마를 관리하므로 Hibernate 는 엔티티-스키마 일치 여부만 검증한다.
      # user-service / health-service 와 동일한 설정이다.
      #
      # ⚠ #40(퀘스트/XP)이 먼저 머지되어야 한다.
      #   quests / wallets / xp_ledgers / outbox_events 를 만드는 마이그레이션이 거기 있어서,
      #   그것 없이 이 PR 만 머지하면 validate 가 부팅을 막는다. (PR #38 리뷰 합의)
      ddl-auto: validate
    open-in-view: false

  flyway:
    # game-service 가 소유한 스키마. 이 설정이 켜지면 Flyway 가 search_path 를 여기로 옮기므로
    # 마이그레이션의 수식어 없는 CREATE TABLE 이 전부 game_service 에 생성된다.
    schemas: game_service


eureka:
  instance:
    # Eureka Server에 주소를 등록할 때 hostname 대신 IP를 선호
    prefer-ip-address: true

  client:
    # Eureka Server에 Game Service 등록
    register-with-eureka: true

    # Eureka Registry의 서비스 목록을 가져옴
    fetch-registry: true

    service-url:
      # Eureka Server 주소
      defaultZone: http://localhost:19000/eureka/

management:
  endpoints:
    web:
      exposure:
        # HTTP로 노출할 Actuator Endpoint
        # health: 애플리케이션 상태 확인, info: 애플리케이션 정보 확인
        include: health, info

rpgym:
  xp:
    source: mock # wallets 준비되면 wallet 으로 변경