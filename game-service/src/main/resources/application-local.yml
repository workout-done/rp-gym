# 로컬 단독 실행용 프로파일.
# Postgres 없이 H2 로 띄워 API 와 Eureka 등록을 확인하기 위한 설정.
# 실행: ./gradlew :game-service:bootRun --args='--spring.profiles.active=local'
spring:
  datasource:
    url: jdbc:h2:mem:gamedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # Flyway 대신 엔티티에서 스키마를 생성한다 (인메모리라 매 실행 초기화).
      ddl-auto: create-drop

  # V1__create_characters.sql 은 Postgres 전용 문법이라 로컬에서는 끈다.
  flyway:
    enabled: false

  h2:
    console:
      enabled: true

# Eureka 는 끄지 않는다 — 서비스 등록 확인이 이 프로파일의 용도 중 하나다.
# discovery-server(19000) 가 떠 있지 않으면 등록 재시도 경고만 나고 애플리케이션은 정상 기동한다.
